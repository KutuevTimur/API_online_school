name: lgg-dev
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: lgg_dev_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      POSTGRES_DB: lgg_dev
      APP_DB_USER: lgg_dev_app
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sql:/docker-entrypoint-initdb.d/init-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgg_dev_owner -d lgg_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8018
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
    ports:
      - "127.0.0.1:8018:8018"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  media:
