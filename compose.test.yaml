name: lgg-test
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: lgg_test_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      POSTGRES_DB: lgg_test
      APP_DB_USER: lgg_test_app
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sql:/docker-entrypoint-initdb.d/init-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgg_test_owner -d lgg_test"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
